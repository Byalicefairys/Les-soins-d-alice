<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les soins d'Alice – Liens</title>
<meta name="description" content="Soins énergétiques, rendez-vous, bougies et voyages en Inde avec Alice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:only light}
  :root{--creme:#FBF7EF;--sable:#F2E8D6;--or:#B8893A;--or-clair:#D9B76E;--bronze:#8A5A2B;--texte:#4A3726}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:2.5rem 1.2rem;
       background:radial-gradient(circle at 50% 0%, #FFFDF8 0%, var(--creme) 45%, var(--sable) 100%);
       color:var(--texte);font-family:'Cormorant Garamond',Georgia,serif;text-align:center}
  main{width:100%;max-width:400px}
  .orne{color:var(--or-clair);letter-spacing:.6em;margin:0 0 .4rem}
  h1{font-family:'Great Vibes',cursive;font-weight:400;color:var(--or);font-size:clamp(3rem,13vw,3.8rem);line-height:1.1;margin:0}
  .signature{font-style:italic;color:var(--bronze);font-size:1.2rem;margin:.2rem 0 .3rem}
  .metiers{font-size:1.05rem;margin:0 0 2rem}
  nav{display:flex;flex-direction:column;gap:.9rem}
  nav a{display:block;padding:.95rem 1rem;border:1px solid var(--or);border-radius:999px;background:rgba(255,253,248,.75);
        color:var(--bronze);text-decoration:none;font-size:1.3rem;font-weight:500;transition:background .2s,color .2s}
  nav a:hover{background:var(--or);color:#fff}
  nav a.principal{background:var(--or);color:#fff}
  nav a.principal:hover{background:var(--bronze);border-color:var(--bronze)}
  a:focus-visible{outline:2px solid var(--or);outline-offset:3px}
  footer{margin-top:2.2rem;font-size:1.05rem}
  footer a{color:var(--bronze)}
</style>
</head>
<body>
<main>
  <p class="orne">✦ ✦ ✦</p>
  <h1>Les soins d'Alice</h1>
  <p class="signature">by Alice Fairy's</p>
  <p class="metiers">Soin énergétique · Magnétisme · Coupeuse de feu</p>

  <nav aria-label="Liens">
    <a href="index.html">Mes soins</a>
    <a class="principal" href="index.html#contact">Prendre rendez-vous</a>
    <a href="bougies.html">Mes bougies</a>
    <a href="voyages.html">Voyages en Inde</a>
  </nav>

  <footer>
    <a href="tel:+33666839474">06 66 83 94 74</a> · Marseille
  </footer>
</main>
</body>
</html>
